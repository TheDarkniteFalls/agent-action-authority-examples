name: checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 action_authority_check.py --self-test
      - run: python3 action_authority_check.py examples/action_cases.jsonl
      - run: python3 scoped_approval_check.py --self-test
      - run: python3 scoped_approval_check.py examples/scoped_approval_cases.jsonl
      - run: python3 effect_recovery_check.py --self-test
      - run: python3 effect_recovery_check.py examples/effect_recovery_cases.jsonl
      - run: python3 plan_fidelity_check.py --self-test
      - run: python3 plan_fidelity_check.py preflight examples/plan-fidelity/manifest.json
      - run: python3 plan_fidelity_check.py check-envelope examples/plan-fidelity/manifest.json examples/plan-fidelity/envelope.json
      - run: python3 plan_fidelity_check.py check-plan examples/plan-fidelity/manifest.json examples/plan-fidelity/envelope.json examples/plan-fidelity/state.json examples/plan-fidelity/accepted_plan.json --json > /tmp/plan-fidelity-1.json
      - run: python3 plan_fidelity_check.py check-plan examples/plan-fidelity/manifest.json examples/plan-fidelity/envelope.json examples/plan-fidelity/state.json examples/plan-fidelity/accepted_plan.json --json > /tmp/plan-fidelity-2.json
      - run: cmp /tmp/plan-fidelity-1.json /tmp/plan-fidelity-2.json
      - run: python3 -m py_compile action_authority_check.py scoped_approval_check.py effect_recovery_check.py plan_fidelity_check.py skills/plan-fidelity/scripts/plan_fidelity_check.py
